[project]
name = "crypto-future-analyzer"
version = "0.0.1"
description = "Analizador de criptomonedas para futuros intradiarios (fase 1: sin ejecución de órdenes)."
# hmmlearn todavía no publica ruedas para 3.14; 3.12 es la recomendada.
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",
    "hmmlearn>=0.3.3",
    "scikit-learn>=1.5",
    "threadpoolctl>=3.1",
    "joblib>=1.4",
    "sqlmodel>=0.0.22",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "anthropic>=1.0",
    "feedparser>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
